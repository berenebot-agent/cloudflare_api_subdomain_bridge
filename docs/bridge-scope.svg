<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#f8fafc"/>

  <!-- Clients -->
  <text x="60" y="40" fill="#0f172a" font-size="15" font-weight="700">Clients / Agents</text>

  <rect x="40" y="60" width="180" height="70" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="90" fill="#0f172a" font-size="13" font-weight="600">Agent A</text>
  <text x="60" y="110" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">key · hermes.example.com</text>

  <rect x="40" y="150" width="180" height="70" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="180" fill="#0f172a" font-size="13" font-weight="600">Agent B</text>
  <text x="60" y="200" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">key · mail.example.com</text>

  <!-- Bridge -->
  <rect x="300" y="60" width="230" height="300" rx="14" fill="#0f172a"/>
  <text x="415" y="95" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Cloudflare</text>
  <text x="415" y="115" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Subdomain Bridge</text>
  <line x1="325" y1="132" x2="505" y2="132" stroke="#334155"/>
  <text x="415" y="158" fill="#94a3b8" font-size="11" text-anchor="middle">holds the ONE upstream token</text>
  <text x="415" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">enforces scope + permissions</text>
  <rect x="325" y="200" width="180" height="130" rx="8" fill="#1e293b"/>
  <text x="415" y="224" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">dns · workers</text>
  <text x="415" y="246" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">tunnels · email</text>
  <text x="415" y="280" fill="#64748b" font-size="10" text-anchor="middle">ownership ledger (SQLite)</text>
  <text x="415" y="298" fill="#64748b" font-size="10" text-anchor="middle">audit trail</text>

  <!-- Cloudflare API -->
  <rect x="660" y="150" width="180" height="120" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="750" y="190" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Cloudflare API</text>
  <text x="750" y="212" fill="#64748b" font-size="11" text-anchor="middle">your real account</text>
  <text x="750" y="232" fill="#64748b" font-size="11" text-anchor="middle">and zone</text>

  <!-- allowed arrows -->
  <line x1="220" y1="95" x2="298" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="185" x2="298" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="210" x2="658" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="594" y="200" fill="#16a34a" font-size="11" text-anchor="middle" font-weight="700">allowed</text>

  <!-- blocked examples -->
  <text x="415" y="405" fill="#dc2626" font-size="12" text-anchor="middle" font-weight="700">BLOCKED at the edge</text>
  <text x="415" y="428" fill="#dc2626" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">xsonny.example.com · out-of-scope names</text>
  <text x="415" y="446" fill="#dc2626" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">other zones · unrelated services · wildcards</text>

  <!-- blocked arrow from A across -->
  <path d="M220 185 C 250 300, 350 370, 415 388" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowX)"/>
</svg>
