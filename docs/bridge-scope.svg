<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="465" viewBox="0 0 1200 465" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Subdomain Bridge: permitted and blocked requests</title>
  <desc id="desc">An agent sends a bearer-key request to the bridge. Requests for app.hermes.example.com are allowed; requests for other.example.com are blocked.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ebfbf0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0f0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#192b4a" flood-opacity=".08"/></filter>
    <marker id="arrowNavy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#445a78"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16a34a"/></marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="465" fill="#fff"/>
  <!-- Client request passes through a single policy-enforcing bridge. -->
  <path d="M302 231H370" stroke="#445a78" stroke-width="3.5" stroke-linecap="round" fill="none" marker-end="url(#arrowNavy)"/>
  <path d="M788 202C824 202 827 130 858 130" stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M788 258C824 258 827 332 858 332" stroke="#dc2626" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrowRed)"/>
  <!-- Agent -->
  <rect x="34" y="127" width="265" height="217" rx="22" fill="url(#blue)" stroke="#aabbd0" stroke-width="3" filter="url(#shadow)"/>
  <g transform="translate(132 148)" fill="none" stroke="#142c56" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M35 0V13"/><circle cx="35" cy="-4" r="6" fill="#95bdf5"/><rect x="-2" y="16" width="74" height="62" rx="23" fill="#e7f1ff"/>
    <rect x="9" y="33" width="53" height="29" rx="13" fill="#142c56"/><circle cx="26" cy="47" r="5.5" fill="#fff" stroke="none"/><circle cx="46" cy="47" r="5.5" fill="#fff" stroke="none"/>
    <path d="M-2 70Q-9 84 -9 96M72 70Q79 84 79 96"/>
  </g>
  <text x="166" y="278" text-anchor="middle" font-size="29" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="750" fill="#122b51">Agent</text>
  <rect x="69" y="294" width="194" height="34" rx="11" fill="#e0eafa"/>
  <text x="166" y="316" text-anchor="middle" font-size="16" font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#395575">Bearer key + request</text>
  <!-- Bridge -->
  <rect x="384" y="86" width="405" height="296" rx="24" fill="url(#blue)" stroke="#2b74eb" stroke-width="3.5" filter="url(#shadow)"/>
  <g transform="translate(531 136)" fill="#f97316">
    <path d="M20 75C7 75 1 65 1 54c0-11 8-20 19-21 5-21 25-33 43-28 14-15 43-13 55 4 23-2 42 14 44 35 14 5 21 17 17 29-2 7-10 12-19 12H20Z"/>
    <path d="M155 33c-17 3-29 16-32 31h58c4-12-7-30-26-31" fill="#fbad2e"/>
  </g>
  <text x="586" y="256" text-anchor="middle" font-size="29" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="750" fill="#132b50">Cloudflare</text>
  <text x="586" y="295" text-anchor="middle" font-size="31" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="750" fill="#132b50">Subdomain Bridge</text>
  <text x="586" y="331" text-anchor="middle" font-size="18" font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#49617f">Checks scope and permissions</text>
  <!-- Allowed -->
  <rect x="868" y="53" width="306" height="161" rx="20" fill="url(#green)" stroke="#16a34a" stroke-width="3.5" filter="url(#shadow)"/>
  <circle cx="906" cy="98" r="24" fill="#16a34a"/>
  <path d="M894 98L902 107L919 88" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="944" y="105" font-size="25" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="750" fill="#133151">Valid domain</text>
  <rect x="890" y="127" width="262" height="37" rx="10" fill="#d9f5e4"/>
  <text x="1021" y="151" text-anchor="middle" font-size="16.5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#0f334d">app.hermes.example.com</text>
  <text x="892" y="194" font-size="18" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" fill="#138344">Allowed</text>
  <!-- Blocked -->
  <rect x="868" y="253" width="306" height="161" rx="20" fill="url(#red)" stroke="#e23b3b" stroke-width="3.5" filter="url(#shadow)"/>
  <circle cx="906" cy="298" r="24" fill="#e23b3b"/>
  <path d="M896 288L916 308M916 288L896 308" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="944" y="305" font-size="25" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="750" fill="#133151">Invalid domain</text>
  <rect x="890" y="327" width="262" height="37" rx="10" fill="#fee2e2"/>
  <text x="1021" y="351" text-anchor="middle" font-size="17" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#5d1c24">other.example.com</text>
  <text x="892" y="393" font-size="18" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" fill="#b91c1c">Blocked</text>
</svg>