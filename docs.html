<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cloudflare Subdomain Bridge API</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1c2638;background:#f7f9fc}body{max-width:1100px;margin:auto;padding:24px}header{margin-bottom:25px}h1{margin-bottom:6px}p{color:#546278}section{background:#fff;border:1px solid #d8e1ee;border-radius:10px;padding:20px;margin:16px 0}label{display:block;margin:10px 0 4px;font-weight:600}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #bccadc;border-radius:5px}input,textarea{width:100%;box-sizing:border-box}textarea{min-height:120px;font-family:ui-monospace,monospace}button{cursor:pointer;background:#172b56;color:white}button:hover{background:#2853ac}.endpoint{display:grid;grid-template-columns:85px 1fr;gap:6px;align-items:center;padding:9px;border-bottom:1px solid #e5e9f0}.endpoint:hover{background:#f6f9fc;cursor:pointer}.endpoint code{word-break:break-all}.get{color:#00865b}.post{color:#a37106}.delete{color:#b52d2b}.put,.patch{color:#2256c9}pre{overflow:auto;background:#0e1b33;color:#d3e1f8;border-radius:8px;padding:14px;max-height:500px}small{color:#5d6b82}</style></head><body><header><h1>Cloudflare Subdomain Bridge</h1><p>Self-contained interactive API documentation. All client permissions are set in environment variables. <a href="/openapi.json">OpenAPI 3.1 JSON</a></p></header>
<section><h2>Authentication</h2><label for="key">Client API key (held in this page's memory only)</label><input type="password" id="key" autocomplete="off" placeholder="Bearer token"></section>
<section><h2>Endpoints</h2><div id="endpoints">Loading…</div></section>
<section><h2>Try an API call</h2><label for="method">Method</label><select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select><label for="path">Path (replace {id} placeholders)</label><input id="path" value="/api/v1/me"><label for="body">JSON body (POST/PUT/PATCH)</label><textarea id="body" spellcheck="false" placeholder='{"hostname":"app.example.com"}'></textarea><p><button id="send">Send request</button> <small>Use HTTPS before entering a real API key.</small></p><pre id="output">Response appears here</pre></section>
<script>
const $=id=>document.getElementById(id);const methods=['get','post','put','patch','delete'];fetch('/openapi.json').then(r=>r.json()).then(spec=>{let container=$('endpoints');container.textContent='';for(const [path,ops] of Object.entries(spec.paths)){for(const method of methods){const operation=ops[method];if(!operation)continue;let e=document.createElement('div');e.className='endpoint';let m=document.createElement('strong');m.className=method;m.textContent=method.toUpperCase();let text=document.createElement('code');text.textContent=path+' — '+operation.summary;e.append(m,text);e.addEventListener('click',()=>{$('method').value=method.toUpperCase();$('path').value=path;$('body').value=operation['x-example']?JSON.stringify(operation['x-example'],null,2):'';document.getElementById('method').scrollIntoView({behavior:'smooth'})});container.append(e)}}}).catch(()=>{$('endpoints').textContent='OpenAPI schema unavailable'});
$('send').addEventListener('click',async()=>{const method=$('method').value,path=$('path').value,key=$('key').value;if(!path.startsWith('/api/v1/')&&!path.startsWith('/healthz')){$('output').textContent='Only API paths are allowed';return};const headers={'Accept':'application/json'};if(key)headers.Authorization='Bearer '+key;const opts={method,headers};if(['POST','PUT','PATCH'].includes(method)){headers['Content-Type']='application/json';opts.body=$('body').value||'{}'};$('output').textContent='Request in progress';try{const resp=await fetch(path,opts);$('output').textContent=`HTTP ${resp.status}\n`+await resp.text()}catch(e){$('output').textContent='Request failed: '+e.message}});
</script></body></html>
